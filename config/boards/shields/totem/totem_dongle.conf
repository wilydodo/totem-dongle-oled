CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

CONFIG_ZMK_SLEEP=n

# Battery (수정된 부분)
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Display
CONFIG_ZMK_DISPLAY=y
CONFIG_SSD1306=y

# Custom status screen
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Dongle battery
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y

# Output status
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y

# Layer status
CONFIG_ZMK_DONGLE_DISPLAY_LAYER=y

# Modifiers
CONFIG_ZMK_DONGLE_DISPLAY_MODIFIERS=y

# HID indicators
CONFIG_ZMK_HID_INDICATORS=y

# Bongo Cat
CONFIG_ZMK_DONGLE_DISPLAY_BONGO_CAT=y

# WPM
CONFIG_ZMK_DONGLE_DISPLAY_WPM=y

# 1. 리눅스 BlueZ 재연결 및 보안 협상 호환성 개선
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# 2. 페어링 후 저장 대기 시간을 60초 -> 5초로 단축 (전원 껐다 켜도 본딩 유지)
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=5000

# 3. BLE 연결 안정성 향상 (2M PHY 협상 충돌 방지)
CONFIG_BT_CTLR_PHY_2M=n

